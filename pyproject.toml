[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rooted_and_rising_crew"
version = "0.1.0"
description = "A multi-agent child growth co-pilot for Indian parents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shahista Gilani", email = "shahistagilani@gmail.com" }]
requires-python = ">=3.12,<3.14"

dependencies = [
    # Agent framework
    "crewai[tools]==1.14.4",

    # LLM
    "anthropic>=0.40.0",

    # API framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",   # file upload support

    # Database + ORM
    "sqlmodel>=0.0.22",
    "aiosqlite>=0.20.0",

    # Data validation
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # Audio transcription (local, free)
    "faster-whisper>=1.1.0",

    # PDF generation
    "weasyprint>=63.0",
    "jinja2>=3.1.4",             # HTML templates for PDF

    # HTTP client (for external APIs)
    "httpx>=0.28.0",

    # Logging
    "structlog>=24.4.0",

    # Scheduling (nightly nudge agent)
    "apscheduler>=3.10.4",

    # Utilities
    "python-dotenv>=1.0.1",
    "pillow>=11.0.0",            # image handling
    "python-dateutil>=2.9.0",
    "rich>=13.9.0",              # nice CLI output
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",             # TestClient for FastAPI
    "ruff>=0.8.0",               # linter + formatter
    "mypy>=1.13.0",              # type checker
    "pre-commit>=4.0.0",
]

[project.scripts]
rooted_and_rising_crew = "rooted_and_rising_crew.main:run"
run_crew = "rooted_and_rising_crew.main:run"
train = "rooted_and_rising_crew.main:train"
replay = "rooted_and_rising_crew.main:replay"
test = "rooted_and_rising_crew.main:test"
run_with_trigger = "rooted_and_rising_crew.main:run_with_trigger"

[tool.hatch.build.targets.wheel]
packages = ["src/rooted_and_rising_crew"]

[tool.crewai]
type = "crew"

# ── Ruff (linter + formatter) ────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["rooted_and_rising_crew"]

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=rooted_and_rising_crew --cov-report=term-missing --cov-fail-under=80"

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["rooted_and_rising_crew"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
